:root {--ink:#111d30;--muted:#6b7b90;--line:#dde6ef;--accent:#0bbbd0;--deep:#0a1726;--surface:#ffffff;--page:#f6f9fb}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--page);color:var(--ink);min-height:100vh;overflow-x:hidden}

.lang{position:relative}.lang-btn,.theme-btn{display:flex;align-items:center;gap:7px;background:transparent;border:0;color:white;padding:10px;border-radius:12px;font-weight:800}.lang-btn:hover,.theme-btn:hover{background:rgba(255,255,255,.1)}.lang-btn svg{width:16px;height:16px}.lang-menu{position:absolute;right:0;top:calc(100% + 7px);padding:7px;width:154px;background:#fff;color:#112438;border:1px solid #dce5ef;border-radius:14px;box-shadow:0 15px 40px #05111e40;display:none}.lang.open .lang-menu{display:block}.lang-menu button{width:100%;display:flex;align-items:center;gap:9px;padding:10px 11px;border:0;background:white;color:#112438;font-weight:650;text-align:left;border-radius:8px}.lang-menu button:hover,.lang-menu button.selected{background:#e7f8fb;color:#047d90}
.flag{width:26px;height:17px;border-radius:3px;border:1px solid #ffffff55;box-shadow:0 1px 2px #0002;display:inline-block;flex-shrink:0}.flag.ru{background:linear-gradient(#fff 0 33%,#2655c7 33% 67%,#e63a42 67%)}.flag.uz{background:linear-gradient(#39c4f1 0 32%,#fff 32% 38%,#d13a4a 38% 41%,#fff 41% 65%,#d13a4a 65% 68%,#12b36a 68%)}.flag.en{background:linear-gradient(90deg,#c33 0 15%,white 15% 22%,#c33 22% 36%,white 36% 43%,#c33 43% 57%,white 57% 64%,#c33 64% 78%,white 78% 85%,#c33 85%)}
.hero{padding:76px 0 68px;background:radial-gradient(600px 300px at 85% 30%,#0b9cb528,transparent),linear-gradient(145deg,#111e31,#07131e);color:white}.tag{display:inline-block;color:#39deed;text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:850;margin-bottom:16px}.hero h1{font-size:clamp(33px,5.5vw,64px);line-height:1.12;letter-spacing:-.05em;font-weight:900;margin:0 0 22px;max-width:820px}.hero h1 em{color:#1bd0dd;font-style:normal}.hero p{color:#b6c6d3;line-height:1.7;max-width:680px;font-size:17px;margin:0 0 30px}.hero-actions{display:flex;flex-wrap:wrap;gap:13px}.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;padding:14px 21px;min-height:50px;font-size:14px;font-weight:850;border:1px solid transparent}.button-main{background:#0bbbd0;color:#051925}.button-main:hover{background:#38dbe7}.button-outline{background:transparent;border-color:#56697c;color:white}.button-outline:hover{background:#26394b}.button-light{background:#fff;border:1px solid #d7e3ec;color:#132136}.button-light:hover{border-color:#0bbbd0}.button svg{width:17px;height:17px}
.content{padding:55px 0 80px}.info-wrap{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 15px 50px #0a243408;overflow:hidden}.info-head{display:flex;align-items:center;gap:14px;padding:28px 32px;border-bottom:1px solid var(--line)}.info-icon{width:48px;height:48px;border-radius:14px;background:#ddf9fb;color:#057d94;display:grid;place-items:center;font-size:25px}.info-head strong{font-size:20px}.info-body{padding:30px 32px}.info-body p{max-width:790px;color:var(--muted);line-height:1.8;margin:0 0 26px}.info-links{display:flex;gap:12px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 25px}.card{border:1px solid var(--line);border-radius:19px;padding:24px;background:var(--surface)}.step-num{width:38px;height:38px;background:#d9f5f9;border-radius:11px;color:#047f91;display:grid;place-items:center;font-weight:900;margin-bottom:15px}.card h3{font-size:18px;margin:0 0 9px}.card p{font-size:14px;line-height:1.65;color:var(--muted);margin:0}.below{margin-top:24px;border-radius:21px;background:#deeff3;padding:26px 30px;display:flex;justify-content:space-between;gap:18px;align-items:center}.below h3{margin:0 0 7px;font-size:21px}.below p{margin:0;color:#526575;font-size:14px}.footer{background:#081421;color:#8da3b7;padding:32px 0}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.footer-links{display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:13px}.footer-links a:hover{color:#fff}.footer small{font-size:12px}
.tabbar{display:none} body.dark-mode{--ink:#f3fbff;--muted:#a9bbca;--line:#304356;--surface:#111e2c;--page:#081421}.dark-mode .content{background:#081421}.dark-mode .info-head strong,.dark-mode .card h3{color:#fff}.dark-mode .below{background:#163842}.dark-mode .below h3{color:#fff}.dark-mode .below p{color:#c9dae2}.dark-mode .button-light{background:#192e42;color:#f7fbff;border-color:#38566b}
@media(max-width:767px){.shell{padding:0 18px}.header-inner{height:72px}.header-nav{display:none}.logo{font-size:24px}.logo-icon{width:32px;height:32px}.hero{padding:56px 0 48px}.hero p{font-size:15px}.hero h1{font-size:36px}.hero-actions{flex-direction:column}.hero-actions .button{width:100%}.content{padding:28px 0 98px}.cards{grid-template-columns:1fr}.info-head{padding:20px}.info-body{padding:20px}.below{flex-direction:column;align-items:stretch}.tabbar{height:68px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:15;background:#fff;border-top:1px solid #d6e1e9;padding-bottom:env(safe-area-inset-bottom)}.tabbar a{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#6e7d8d;font-size:10px;font-weight:750}.tabbar svg{width:21px;height:21px}.tabbar a.active{color:#068ba0}.tabbar a.active:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#0bbbd0}.dark-mode .tabbar{background:#101a27;border-color:#25394a}}
</style></head>
<body><header class="header"><div class="shell header-inner"><a class="logo" href="index.html" aria-label="OSUZ"><img class="logo-icon" src="osuz%20logo.png" alt=""><span>osuz</span></a><nav class="header-nav"><a href="index.html" data-ui="home"></a><a href="category.html" data-ui="catalog"></a><a href="sellers.html" data-ui="seller"></a></nav><div class="actions"><div class="lang" id="languagePicker"><button type="button" class="lang-btn" id="languageBtn" aria-expanded="false" aria-haspopup="true"><span class="flag ru" id="currentFlag"></span><span id="languageCode">RU</span><i data-lucide="chevron-down"></i></button><div class="lang-menu" id="languageMenu"><button type="button" data-lang="ru"><span class="flag ru"></span>Русский</button><button type="button" data-lang="uz"><span class="flag uz"></span>O‘zbekcha</button><button type="button" data-lang="en"><span class="flag en"></span>English</button></div></div><button class="theme-btn" id="themeBtn" type="button" aria-label="Сменить тему"><i data-lucide="moon"></i></button></div></div></header>
<main><section class="hero"><div class="shell"><span class="tag" data-key="eyebrow"></span><h1 data-key="title"></h1><p data-key="desc"></p><div class="hero-actions"><a class="button button-main" href="category.html"><span data-key="primary"></span><i data-lucide="arrow-up-right"></i></a><a class="button button-outline" href="mailto:info@osuz.uz"><span data-key="secondary"></span><i data-lucide="mail"></i></a></div></div></section><section class="content"><div class="shell"><article class="info-wrap"><div class="info-head"><div class="info-icon"><i data-lucide="file-clock"></i></div><strong data-key="info_title"></strong></div><div class="info-body"><p data-key="info_desc"></p><div class="info-links"><a class="button button-light" href="category.html"><span data-key="primary"></span><i data-lucide="arrow-right"></i></a><a class="button button-light" href="index.html"><span data-ui="goBack"></span></a></div></div></article></div></section></main>

<script>
(()=>{
const localeData={"ru": {"eyebrow": "Покупателям", "title": "Условия доставки и оплаты", "desc": "Информация о доставке и оплате готовится к публикации.", "state": "Раздел в разработке", "info_title": "Уточните условия у продавца", "info_desc": "Сроки доставки, варианты получения и доступные способы оплаты зависят от конкретного продавца. Они уточняются при оформлении запроса.", "primary": "Открыть каталог", "secondary": "Связаться с нами"}, "uz": {"eyebrow": "Xaridorlarga", "title": "Yetkazib berish va to‘lov shartlari", "desc": "Yetkazib berish va to‘lov haqidagi ma’lumotlar tayyorlanmoqda.", "state": "Bo‘lim tayyorlanmoqda", "info_title": "Shartlarni sotuvchidan aniqlang", "info_desc": "Yetkazib berish muddati va to‘lov usullari sotuvchiga bog‘liq. Ularni so‘rovni rasmiylashtirishda aniqlang.", "primary": "Katalogga o‘tish", "secondary": "Biz bilan bog‘lanish"}, "en": {"eyebrow": "For customers", "title": "Delivery and payment", "desc": "Delivery and payment information is being prepared.", "state": "Page in progress", "info_title": "Confirm details with the seller", "info_desc": "Delivery times and available payment methods depend on the seller. Confirm them as part of your request.", "primary": "Browse catalog", "secondary": "Contact us"}},ui={"ru": {"home": "Главная", "catalog": "Каталог", "orders": "Заказы", "cart": "Корзина", "profile": "Профиль", "seller": "Продавцам", "goBack": "На главную", "rights": "Все права защищены", "sellerCabinet": "Кабинет продавца", "support": "Написать нам"}, "uz": {"home": "Bosh sahifa", "catalog": "Katalog", "orders": "Buyurtmalar", "cart": "Savat", "profile": "Profil", "seller": "Sotuvchilar uchun", "goBack": "Bosh sahifaga", "rights": "Barcha huquqlar himoyalangan", "sellerCabinet": "Sotuvchi kabineti", "support": "Bizga yozing"}, "en": {"home": "Home", "catalog": "Catalog", "orders": "Orders", "cart": "Cart", "profile": "Profile", "seller": "For sellers", "goBack": "Back home", "rights": "All rights reserved", "sellerCabinet": "Seller portal", "support": "Contact us"}};
const getLang=()=>{try{let v=localStorage.getItem('osuzLang');return ['ru','uz','en'].includes(v)?v:'ru'}catch(e){return 'ru'}};
function setLang(lang){
 const t=localeData[lang]||localeData.ru;
 document.documentElement.lang=lang;document.querySelectorAll('[data-key]').forEach(el=>{let k=el.dataset.key;if(k in t)el.textContent=t[k]});
 document.querySelectorAll('[data-ui]').forEach(el=>{el.textContent=(ui[lang]||ui.ru)[el.dataset.ui]||el.textContent});
 document.title='OSUZ — '+t.title;
 document.getElementById('languageCode').textContent=lang.toUpperCase();
 document.getElementById('currentFlag').className='flag '+lang;
 document.querySelectorAll('[data-lang]').forEach(el=>el.classList.toggle('selected',el.dataset.lang===lang));
 const wrap=document.getElementById('sellerCards');if(wrap&&t.cards){wrap.replaceChildren();for(const item of t.cards){const c=document.createElement('article');c.className='card';const n=document.createElement('div');n.className='step-num';n.textContent=item[0];const h=document.createElement('h3');h.textContent=item[1];const p=document.createElement('p');p.textContent=item[2];c.append(n,h,p);wrap.appendChild(c)}}
 document.getElementById('languagePicker').classList.remove('open');document.getElementById('languageBtn').setAttribute('aria-expanded','false');
}
const picker=document.getElementById('languagePicker');
document.getElementById('languageBtn').addEventListener('click',()=>{picker.classList.toggle('open');document.getElementById('languageBtn').setAttribute('aria-expanded',String(picker.classList.contains('open')))});
document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>{try{localStorage.setItem('osuzLang',el.dataset.lang)}catch(e){}setLang(el.dataset.lang)}));
document.addEventListener('click',e=>{if(!picker.contains(e.target))picker.classList.remove('open')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')picker.classList.remove('open')});
const toggle=()=>{const d=document.body.classList.toggle('dark-mode');try{localStorage.setItem('osuzTheme',d?'dark':'light')}catch(e){}};
document.getElementById('themeBtn').addEventListener('click',toggle);
try{document.body.classList.toggle('dark-mode',localStorage.getItem('osuzTheme')==='dark')}catch(e){}
setLang(getLang());if(window.lucide)window.lucide.createIcons();
})();
</script></body></html>
